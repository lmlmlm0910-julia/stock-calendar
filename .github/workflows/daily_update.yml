name: Daily Stock Schedule Auto Update

on:
  schedule:
    # 💥 매 30분마다 자동 실행 (예: 1:00, 1:30, 2:00, 2:30 ...)
    - cron: '*/30 * * * *'
  workflow_dispatch: # GitHub 웹 화면에서 'Run workflow' 버튼으로 언제든 수동 실행 가능

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Google AI & Finance Libraries
        run: pip install google-genai yfinance

      - name: Run Stock Schedule Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_calendar.py

      - name: Run US Market Wrapup Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_us_market.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json us_market.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update all market reports & news with real financial data" && git push)

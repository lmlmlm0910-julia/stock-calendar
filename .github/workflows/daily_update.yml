name: Daily Stock Schedule Auto Update

on:
  schedule:
    # 매일 아침 6시 (한국시간 KST 기준) 자동 실행
    - cron: '0 21 * * *'
  workflow_dispatch:

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Google AI Library
        run: pip install google-genai

      - name: Run Stock Schedule Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_calendar.py

      - name: Run US Market Wrapup Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_us_market.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json us_market.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update all market reports by Gemini AI" && git push)

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>증시 주요 일정 & AI 수혜주 분석</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800">

  <!-- 상단 네비게이션 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-10">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold text-slate-900 flex items-center gap-2">
        <i class="fa-solid fa-chart-line text-blue-600"></i> 증시 자동 일정 & AI 분석
      </h1>
      <span class="text-xs bg-emerald-100 text-emerald-800 font-semibold px-2.5 py-1 rounded-full">실시간 AI 연동 ON</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- 주간 브리핑 헤더 -->
    <div class="bg-gradient-to-r from-blue-600 to-indigo-700 rounded-2xl p-6 text-white mb-8 shadow-lg">
      <div class="text-sm font-medium text-blue-200 mb-1">REAL-TIME WEEKLY BRIEF</div>
      <h2 class="text-2xl font-bold mb-2">증시 주요 일정 및 수혜주 분석</h2>
      <p class="text-blue-100 text-sm">Gemini AI가 실시간 주요 이벤트와 예상 수혜 기업을 자동으로 업데이트합니다.</p>
    </div>

    <!-- AI 데이터가 들어올 영역 -->
    <div id="schedule-container" class="space-y-6">
      <div class="text-center py-12 text-slate-400">
        <i class="fa-solid fa-spinner fa-spin text-2xl text-blue-500 mb-2 block"></i>
        Gemini AI가 분석한 최신 데이터를 불러오는 중입니다...
      </div>
    </div>
  </main>

  <script>
    async function fetchCalendarData() {
      try {
        // data.json 데이터를 캐시 없이 항상 최신으로 불러오기
        const response = await fetch('data.json?v=' + new Date().getTime());
        const data = await response.json();
        
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        data.forEach(item => {
          const impactBadge = item.impact === '상' ? 'bg-rose-100 text-rose-800' : 
                             (item.impact === '중' ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800');
          
          const stocksTags = item.stocks && item.stocks.length > 0 ? 
            item.stocks.map(s => `<span class="text-xs bg-slate-200 text-slate-700 px-2 py-0.5 rounded">관련주: ${s}</span>`).join(' ') : '';

          const card = `
            <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-200">
              <div class="flex items-center gap-2 mb-4">
                <span class="text-lg font-bold text-slate-900">${item.date}</span>
                <span class="text-sm text-slate-500 font-medium">(${item.day})</span>
                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-slate-100 text-slate-600 ml-auto">${item.category || '증시 일정'}</span>
              </div>

              <div class="p-4 bg-slate-50 rounded-lg border border-slate-100">
                <div class="flex justify-between items-start mb-2">
                  <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-calendar-check text-blue-500"></i> ${item.title}
                  </h3>
                  <span class="text-xs font-bold px-2 py-0.5 rounded ${impactBadge}">영향도: ${item.impact || '보통'}</span>
                </div>
                
                <div class="text-xs text-slate-600 mb-2">${item.details || ''}</div>
                
                <div class="flex flex-wrap gap-1.5 my-2">
                  ${stocksTags}
                </div>

                <div class="mt-3 bg-white p-3 rounded border border-blue-100 text-xs leading-relaxed text-slate-700">
                  <strong class="text-blue-600 block mb-1">🤖 AI 수혜 및 포인트 분석</strong>
                  ${item.analysis}
                </div>
              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      } catch (error) {
        console.error("데이터 로드 실패:", error);
        document.getElementById('schedule-container').innerHTML = 
          '<div class="text-center py-12 text-rose-500 font-semibold">데이터를 불러올 수 없습니다. 잠시 후 다시 접속해 주세요.</div>';
      }
    }

    fetchCalendarData();
  </script>

  <footer class="text-center py-6 text-xs text-slate-400">
    © 2026 증시 일정 AI 자동화 서비스. All rights reserved.
  </footer>
</body>
</html>

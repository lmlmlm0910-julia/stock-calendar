<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레드불의 증시 자동 일정 & AI 심층 분석</title>
  <!-- 사파리 차단 방지용 안전 스타일 라이브러리 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- 상단 네비게이션 -->
  <header class="bg-gray-900 text-white border-b border-gray-800 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span class="bg-red-600 text-white text-xs px-2 py-1 rounded font-extrabold tracking-wider">RED BULL</span>
        <span>증시 자동 일정 & AI 심층 분석</span>
      </h1>
      <span class="text-xs bg-red-900 text-red-300 border border-red-700 font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 실시간 AI 연동 ON
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- 주간 브리핑 헤더 -->
    <div class="bg-gradient-to-r from-red-600 to-indigo-800 rounded-2xl p-6 text-white mb-8 shadow-xl">
      <div class="text-xs font-bold text-red-200 tracking-widest mb-1">RED BULL STOCK ANALYTICS</div>
      <h2 class="text-2xl font-bold mb-2">🔥 레드불의 글로벌 증시 일정 & 수혜주 리포트</h2>
      <p class="text-red-100 text-sm">Gemini AI가 주요 일정의 중요도, 관전 포인트, 한국·미국 증시 영향도 및 수혜주를 심도 있게 분석합니다.</p>
    </div>

    <!-- AI 데이터가 들어올 영역 -->
    <div id="schedule-container" class="space-y-6">
      <div class="bg-white rounded-xl p-12 text-center text-gray-400 border border-gray-200 shadow-sm">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-red-500 mb-3 block"></i>
        Gemini AI가 분석한 최신 심층 데이터를 불러오는 중입니다...
      </div>
    </div>
  </main>

  <script>
    async function fetchCalendarData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        const data = await response.json();
        
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        data.forEach(item => {
          const impactBadge = item.impact === '상' ? 'bg-red-100 text-red-700 border-red-200' : 
                             (item.impact === '중' ? 'bg-yellow-100 text-yellow-800 border-yellow-200' : 'bg-blue-100 text-blue-700 border-blue-200');
          
          const stocksList = item.stocks && item.stocks.length > 0 ? 
            item.stocks.map(s => `<span class="text-xs font-semibold bg-red-50 text-red-700 border border-red-200 px-2 py-1 rounded mr-1"># ${s}</span>`).join('') : '';

          const card = `
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6">
              
              <!-- 날짜 및 타이틀 헤더 -->
              <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center gap-2">
                  <span class="text-base font-extrabold text-gray-900">${item.year || '2026'}년 ${item.date}</span>
                  <span class="text-sm font-semibold text-gray-500">(${item.day})</span>
                  <span class="text-xs bg-gray-200 text-gray-700 font-medium px-2 py-0.5 rounded ml-2">${item.category || '주요 일정'}</span>
                </div>
                <span class="text-xs font-bold px-3 py-1 rounded-full border ${impactBadge}">시장 파급력: ${item.impact || '보통'}</span>
              </div>

              <!-- 본문 내용 -->
              <div class="p-6 space-y-4 text-sm text-gray-700">
                
                <!-- 일정 제목 -->
                <h3 class="text-lg font-bold text-gray-900 flex items-center gap-2">
                  <i class="fa-solid fa-calendar-check text-red-500"></i> ${item.title}
                </h3>

                <!-- 1. 어떤 일정인가요? -->
                <div class="bg-gray-50 p-4 rounded-lg border border-gray-200">
                  <span class="font-bold text-gray-900 block mb-1 text-xs text-gray-500 flex items-center gap-1">
                    <i class="fa-solid fa-circle-info text-blue-500"></i> 어떤 일정인가요? (개요)
                  </span>
                  <p class="leading-relaxed text-gray-800">${item.overview || ''}</p>
                </div>

                <!-- 2. 왜 중요한가요? & 핵심 관전 포인트 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div class="bg-yellow-50 p-4 rounded-lg border border-yellow-200">
                    <span class="font-bold text-yellow-900 block mb-1 text-xs flex items-center gap-1">
                      <i class="fa-solid fa-triangle-exclamation text-yellow-600"></i> 왜 중요한가요?
                    </span>
                    <p class="leading-relaxed text-gray-800 text-xs">${item.importance || ''}</p>
                  </div>

                  <div class="bg-blue-50 p-4 rounded-lg border border-blue-200">
                    <span class="font-bold text-blue-900 block mb-1 text-xs flex items-center gap-1">
                      <i class="fa-solid fa-eye text-blue-600"></i> 핵심 관전 포인트
                    </span>
                    <p class="leading-relaxed text-gray-800 text-xs">${item.key_points || ''}</p>
                  </div>
                </div>

                <!-- 3. 증시 미치는 영향 -->
                <div class="space-y-2 pt-2 border-t border-gray-100">
                  <div class="flex items-start gap-2">
                    <span class="text-xs font-bold bg-gray-100 text-gray-800 px-2 py-1 rounded shrink-0">🇰🇷 한국 증시 영향</span>
                    <p class="text-xs text-gray-700 leading-relaxed pt-0.5">${item.korea_impact || ''}</p>
                  </div>
                  ${item.us_impact ? `
                  <div class="flex items-start gap-2">
                    <span class="text-xs font-bold bg-gray-100 text-gray-800 px-2 py-1 rounded shrink-0">🇺🇸 미국 증시 영향</span>
                    <p class="text-xs text-gray-700 leading-relaxed pt-0.5">${item.us_impact}</p>
                  </div>` : ''}
                </div>

                <!-- 4. AI 수혜주 및 종목 분석 -->
                <div class="mt-4 bg-red-50 p-4 rounded-xl border border-red-100">
                  <strong class="text-red-600 font-bold text-xs block mb-2">
                    🤖 Gemini AI 수혜주 & 관련 종목 분석
                  </strong>
                  <div class="mb-2">
                    ${stocksList}
                  </div>
                  <p class="text-xs text-gray-700 leading-relaxed mt-2 pt-2 border-t border-red-200">
                    ${item.stock_reasons || ''}
                  </p>
                </div>

              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      } catch (error) {
        console.error("데이터 로드 실패:", error);
      }
    }

    fetchCalendarData();
  </script>

  <footer class="text-center py-6 text-xs text-gray-400">
    © 2026 레드불 증시 AI 자동화 서비스. All rights reserved.
  </footer>
</body>
</html>

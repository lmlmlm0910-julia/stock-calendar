<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레드불의 증시 자동 일정 & AI 심층 분석</title>
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css)">
</head>
<body class="bg-slate-100 text-slate-800">

  <!-- 상단 네비게이션 -->
  <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-10 shadow-md">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
      <h1 class="text-xl font-bold flex items-center gap-2">
        <span class="bg-red-600 text-white text-xs px-2 py-1 rounded font-extrabold tracking-wider">RED BULL</span>
        <span>증시 자동 일정 & AI 심층 분석</span>
      </h1>
      <span class="text-xs bg-red-500/20 text-red-400 border border-red-500/30 font-semibold px-2.5 py-1 rounded-full flex items-center gap-1">
        <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span> 실시간 AI 엔진 작동 중
      </span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 py-8">
    <!-- 주간 브리핑 헤더 -->
    <div class="bg-gradient-to-r from-red-600 via-rose-600 to-indigo-800 rounded-2xl p-6 text-white mb-8 shadow-xl">
      <div class="text-xs font-bold text-red-200 tracking-widest mb-1">RED BULL STOCK ANALYTICS</div>
      <h2 class="text-2xl font-bold mb-2">🔥 레드불의 글로벌 증시 일정 & 수혜주 리포트</h2>
      <p class="text-red-100 text-sm">Gemini AI가 주요 일정의 중요도, 관전 포인트, 한국·미국 증시 영향도 및 수혜주를 심도 있게 분석합니다.</p>
    </div>

    <!-- AI 데이터가 들어올 영역 -->
    <div id="schedule-container" class="space-y-6">
      <div class="bg-white rounded-xl p-12 text-center text-slate-400 border border-slate-200 shadow-sm">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-red-500 mb-3 block"></i>
        Gemini AI가 분석한 최신 심층 데이터를 불러오는 중입니다...
      </div>
    </div>
  </main>

  <script>
    async function fetchCalendarData() {
      try {
        const response = await fetch('data.json?v=' + new Date().getTime());
        const data = await response.json();
        
        const container = document.getElementById('schedule-container');
        container.innerHTML = '';

        data.forEach(item => {
          const impactBadge = item.impact === '상' ? 'bg-red-100 text-red-700 border-red-200' : 
                             (item.impact === '중' ? 'bg-amber-100 text-amber-700 border-amber-200' : 'bg-blue-100 text-blue-700 border-blue-200');
          
          const stocksList = item.stocks && item.stocks.length > 0 ? 
            item.stocks.map(s => `<span class="text-xs font-semibold bg-red-50 text-red-700 border border-red-200 px-2.5 py-1 rounded-md"># ${s}</span>`).join(' ') : '';

          const card = `
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
              
              <!-- 날짜 및 타이틀 헤더 -->
              <div class="bg-slate-50 p-5 border-b border-slate-200 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-2">
                  <span class="text-base font-extrabold text-slate-900">${item.year || '2026'}년 ${item.date}</span>
                  <span class="text-sm font-semibold text-slate-500">(${item.day})</span>
                  <span class="text-xs bg-slate-200 text-slate-700 font-medium px-2 py-0.5 rounded ml-1">${item.category || '주요 일정'}</span>
                </div>
                <span class="text-xs font-bold px-3 py-1 rounded-full border ${impactBadge}">시장 파급력: ${item.impact || '보통'}</span>
              </div>

              <!-- 본문 내용 -->
              <div class="p-6 space-y-4 text-sm text-slate-700">
                
                <!-- 일정 제목 -->
                <h3 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                  <i class="fa-solid fa-calendar-check text-red-500"></i> ${item.title}
                </h3>

                <!-- 1. 어떤 일정인가요? -->
                <div class="bg-slate-50 p-3.5 rounded-lg border border-slate-200/80">
                  <span class="font-bold text-slate-900 block mb-1 text-xs text-slate-500 flex items-center gap-1">
                    <i class="fa-solid fa-circle-info text-blue-500"></i> 어떤 일정인가요? (개요)
                  </span>
                  <p class="leading-relaxed text-slate-800">${item.overview || '상세 일정 개요입니다.'}</p>
                </div>

                <!-- 2. 왜 중요한가요? & 핵심 관전 포인트 -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                  <div class="bg-amber-50/60 p-3.5 rounded-lg border border-amber-200/60">
                    <span class="font-bold text-amber-900 block mb-1 text-xs flex items-center gap-1">
                      <i class="fa-solid fa-triangle-exclamation text-amber-600"></i> 왜 중요한가요?
                    </span>
                    <p class="leading-relaxed text-slate-800 text-xs">${item.importance || ''}</p>
                  </div>

                  <div class="bg-blue-50/60 p-3.5 rounded-lg border border-blue-200/60">
                    <span class="font-bold text-blue-900 block mb-1 text-xs flex items-center gap-1">
                      <i class="fa-solid fa-eye text-blue-600"></i> 핵심 관전 포인트
                    </span>
                    <p class="leading-relaxed text-slate-800 text-xs">${item.key_points || ''}</p>
                  </div>
                </div>

                <!-- 3. 증시 미치는 영향 (한국 & 미국) -->
                <div class="space-y-2 pt-2 border-t border-slate-100">
                  <div class="flex items-start gap-2">
                    <span class="text-xs font-bold bg-slate-100 text-slate-800 px-2 py-1 rounded shrink-0">🇰🇷 한국 증시 영향</span>
                    <p class="text-xs text-slate-700 leading-relaxed pt-0.5">${item.korea_impact || ''}</p>
                  </div>
                  ${item.us_impact ? `
                  <div class="flex items-start gap-2">
                    <span class="text-xs font-bold bg-slate-100 text-slate-800 px-2 py-1 rounded shrink-0">🇺🇸 미국 증시 영향</span>
                    <p class="text-xs text-slate-700 leading-relaxed pt-0.5">${item.us_impact}</p>
                  </div>` : ''}
                </div>

                <!-- 4. AI 수혜주 및 종목 분석 -->
                <div class="mt-4 bg-gradient-to-r from-red-50 to-rose-50 p-4 rounded-xl border border-red-100">
                  <div class="flex items-center justify-between mb-2">
                    <strong class="text-red-600 font-bold text-xs flex items-center gap-1">
                      🤖 Gemini AI 수혜주 & 관련 종목 분석
                    </strong>
                  </div>
                  <div class="flex flex-wrap gap-1.5 mb-2">
                    ${stocksList}
                  </div>
                  <p class="text-xs text-slate-700 leading-relaxed mt-2 pt-2 border-t border-red-200/50">
                    ${item.stock_reasons || ''}
                  </p>
                </div>

              </div>
            </div>
          `;
          container.innerHTML += card;
        });
      } catch (error) {
        console.error("데이터 로드 실패:", error);
        document.getElementById('schedule-container').innerHTML = 
          '<div class="bg-white p-8 rounded-xl text-center text-rose-500 font-semibold border border-rose-200">심층 분석 데이터를 불러오지 못했습니다. Actions 실행 완료 후 새로고침 해보세요.</div>';
      }
    }

    fetchCalendarData();
  </script>

  <footer class="text-center py-6 text-xs text-slate-400">
    © 2026 레드불 증시 AI 자동화 서비스. All rights reserved.
  </footer>
</body>
</html>
